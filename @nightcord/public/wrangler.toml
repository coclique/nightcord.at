name = "nightcord-at-25"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "nightcord.at"
custom_domain = true

[[routes]]
pattern = "www.nightcord.at"
custom_domain = true

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "nightcord_at_25"
database_id = "49cea6dc-18ac-429f-91de-01fd9e8649fb"
migrations_dir = "../shared/drizzle/"

[[ratelimits]]
name = "POST_RATE_LIMITER"
namespace_id = "1"

[ratelimits.simple]
limit = 2
period = 60

[[ratelimits]]
name = "VIEW_RATE_LIMITER"
namespace_id = "2"

[ratelimits.simple]
limit = 5
period = 10

[ai]
binding = "AI"

[vars]
N25_PUBLIC_DEPLOYMENT_ENV = "production"
N25_PUBLIC_CF_TURNSTILE_SITEKEY = "0x4AAAAAABzvp9Ei968n3hWk"

[observability.logs]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 1.0
